  capstone: false
  section_quiz: false
  modules:
  - id: module-01
    title: Discovering Targets And Relabeling Their Identity
    objectives:
    - Separate discovering candidates from scraping selected targets.
    - Explain target relabeling and internal discovery labels.
    - Distinguish target relabeling from metric relabeling.
    - Account for permission, churn and duplicated target selection.
