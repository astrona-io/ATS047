apiVersion: v1
kind: Namespace
metadata:
  name: starfleet
---
apiVersion: v1
kind: Namespace
metadata:
  name: outpost
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: shop-code
  namespace: starfleet
data:
  app.py: |
    import http.server
    import json
    import socket
    import sys
    import threading
    import time
    import urllib.parse
    import uuid
    from collections import Counter

    lock = threading.Lock()
    requests = Counter()
    records = Counter()
    success_seen = 0
    sampled_out = 0
    SAMPLE_EVERY = 5
    INSTANCE = socket.gethostname()


    def timestamp():
        now = time.time()
        return time.strftime('%Y-%m-%dT%H:%M:%S', time.gmtime(now)) + '.%03dZ' % int((now % 1) * 1000)


    def write_log(record):
        sys.stdout.write(json.dumps(record, sort_keys=True) + '\n')
        sys.stdout.flush()


    class Handler(http.server.BaseHTTPRequestHandler):
        def log_message(self, *args):
            pass

        def do_GET(self):
            global success_seen, sampled_out
            parsed = urllib.parse.urlparse(self.path)
            args = urllib.parse.parse_qs(parsed.query)
            if parsed.path == '/work':
                route = args.get('route', ['/cart'])[0]
                status = int(args.get('status', ['200'])[0])
                user = args.get('user', ['anonymous'])[0]
                delay = min(float(args.get('delay', ['0.02'])[0]), 0.5)
                request_id = uuid.uuid4().hex[:12]
                started = time.perf_counter()
                time.sleep(delay)
                elapsed_ms = round((time.perf_counter() - started) * 1000, 1)
                with lock:
                    requests[(route, str(status))] += 1
                    if status >= 500:
                        keep, every, level = True, 1, 'error'
                    else:
                        success_seen += 1
                        keep, every, level = success_seen % SAMPLE_EVERY == 0, SAMPLE_EVERY, 'info'
                    if keep:
                        records[level] += 1
                    else:
                        sampled_out += 1
                if keep:
                    write_log({'ts': timestamp(), 'level': level, 'service': 'shop', 'instance': INSTANCE,
                               'message': 'request completed', 'request_id': request_id, 'route': route,
                               'status': status, 'duration_ms': elapsed_ms, 'user_id': user,
                               'email': user + '@example.test', 'sample_every': every})
                body = json.dumps({'request_id': request_id, 'route': route, 'status': status}).encode()
                self.send_response(status)
                self.send_header('Content-Type', 'application/json')
                self.end_headers()
                self.wfile.write(body + b'\n')
                return
            if parsed.path == '/metrics':
                lines = ['# HELP shop_http_requests_total Completed requests by route and status.',
                         '# TYPE shop_http_requests_total counter']
                with lock:
                    for (route, status), value in sorted(requests.items()):
                        lines.append('shop_http_requests_total{route="%s",status="%s"} %d' % (route, status, value))
                    lines += ['# HELP shop_log_records_total Log records written by level.',
                              '# TYPE shop_log_records_total counter']
                    for level in ('error', 'info'):
                        lines.append('shop_log_records_total{level="%s"} %d' % (level, records[level]))
                    lines += ['# HELP shop_log_records_sampled_out_total Successful requests that wrote no log record.',
                              '# TYPE shop_log_records_sampled_out_total counter',
                              'shop_log_records_sampled_out_total %d' % sampled_out]
                body = ('\n'.join(lines) + '\n').encode()
            else:
                body = b'shop-ready\n'
            self.send_response(200)
            self.end_headers()
            self.wfile.write(body)


    write_log({'ts': timestamp(), 'level': 'info', 'service': 'shop', 'instance': INSTANCE, 'message': 'shop started'})
    http.server.ThreadingHTTPServer(('0.0.0.0', 8080), Handler).serve_forever()
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: shop
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: shop
  template:
    metadata:
      labels:
        app: shop
    spec:
      containers:
      - name: shop
        image: docker.io/library/python:3.13-alpine
        ports:
        - containerPort: 8080
        command:
        - python
        - -u
        - /code/app.py
        volumeMounts:
        - name: code
          mountPath: /code
      volumes:
      - name: code
        configMap:
          name: shop-code
---
apiVersion: v1
kind: Service
metadata:
  name: shop
  namespace: starfleet
spec:
  selector:
    app: shop
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: v1
kind: Pod
metadata:
  name: shuttle
  namespace: starfleet
spec:
  restartPolicy: Never
  containers:
  - name: reader
    image: docker.io/library/python:3.13-alpine
    command:
    - python
    - -c
    - import time; time.sleep(86400)
---
apiVersion: v1
kind: Pod
metadata:
  name: drifter
  namespace: outpost
spec:
  restartPolicy: Never
  containers:
  - name: reader
    image: docker.io/library/python:3.13-alpine
    command:
    - python
    - -c
    - import time; time.sleep(86400)
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: starfleet
data:
  prometheus.yaml: |
    global:
      evaluation_interval: 2s
      scrape_interval: 2s
    scrape_configs:
    - job_name: shop
      static_configs:
      - targets:
        - shop:8080
    - job_name: prometheus
      static_configs:
      - targets:
        - localhost:9090
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: prometheus
  template:
    metadata:
      labels:
        app: prometheus
    spec:
      containers:
      - name: prometheus
        image: quay.io/prometheus/prometheus:v3.5.5
        ports:
        - containerPort: 9090
        args:
        - --config.file=/config/prometheus.yaml
        - --storage.tsdb.path=/prometheus
        volumeMounts:
        - name: config
          mountPath: /config
        - name: data
          mountPath: /prometheus
      volumes:
      - name: config
        configMap:
          name: prometheus-config
      - name: data
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: starfleet
spec:
  selector:
    app: prometheus
  ports:
  - port: 9090
    targetPort: 9090
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: traffic-code
  namespace: starfleet
data:
  traffic.py: |
    import time
    import urllib.error
    import urllib.request

    ROUTES = ['/cart', '/checkout', '/search']
    n = 0
    while True:
        route = ROUTES[n % 3]
        status = '500' if n % 6 == 1 else '200'
        url = 'http://shop:8080/work?route=%s&status=%s&user=user-%d' % (route, status, n % 20)
        try:
            urllib.request.urlopen(url, timeout=5).read()
        except (urllib.error.URLError, OSError):
            pass
        n += 1
        time.sleep(0.5)
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traffic
  namespace: starfleet
spec:
  replicas: 1
  selector:
    matchLabels:
      app: traffic
  template:
    metadata:
      labels:
        app: traffic
    spec:
      containers:
      - name: traffic
        image: docker.io/library/python:3.13-alpine
        command:
        - python
        - -u
        - /code/traffic.py
        volumeMounts:
        - name: code
          mountPath: /code
      volumes:
      - name: code
        configMap:
          name: traffic-code
